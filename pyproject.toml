[project]
name = "asa"
version = "0.1.0"
description = "Animal Story Automation — original animated animal stories, end to end"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2",
  "pyyaml",
  "python-dotenv",
  "httpx",
  "structlog",
  "tenacity",
  "jinja2",
  "pillow",
  "numpy",
  "soundfile",
  "kokoro",
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "sentence-transformers",
  "google-api-python-client",
  "google-auth-oauthlib",
  "pysubs2",
  "rembg",
]

[project.optional-dependencies]
align = ["faster-whisper"]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.scripts]
asa = "asa.core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asa"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
markers = ["live: hits real external APIs; excluded from CI"]
